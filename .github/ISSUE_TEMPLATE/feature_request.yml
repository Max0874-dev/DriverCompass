name: Feature request / Idee
description: Suggest an improvement. / Verbesserung vorschlagen.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem would this solve? / Welches Problem löst das?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / Vorschlag
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Datenschutz
      options:
        - label: The idea keeps all device data on the PC (no telemetry). / Die Idee lässt alle Gerätedaten auf dem PC.
