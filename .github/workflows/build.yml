name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DriverCompass.slnx

      - name: Build (Release, x64)
        run: dotnet build DriverCompass.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test --solution DriverCompass.slnx -c Release -p:Platform=x64 --no-build --report-xunit-trx --results-directory TestResults

      # The Microsoft Store edition leaves out the installer via #if; make sure it still compiles.
      - name: Build Store edition (x64)
        run: dotnet build src/DriverCompass.App/DriverCompass.App.csproj -c Release -p:Platform=x64 -p:DriverCompassEdition=Store

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/**/*.trx
