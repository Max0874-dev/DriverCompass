name: Check vendor links

# Once a month, opens every fixed driver page link in data/vendors.json.
# The run fails only on clear errors (404/410, unknown host, invalid certificate,
# redirect to a foreign domain); GitHub then sends the usual failure e-mail.
# 403s and timeouts are listed as warnings in the run summary, because many vendor
# sites block automated requests. Only public vendor pages are requested.
on:
  schedule:
    - cron: '17 6 1 * *'   # 06:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check driver page links
        shell: pwsh
        run: ./scripts/check-vendor-links.ps1
